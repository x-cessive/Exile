; XCSV-CHATTER-001 returning-player briefing SQL_CUSTOM fragment.
;
; Live location:
;   E:\arma3server\@ExileServer\sql_custom\exile.ini
; Compatibility mirror:
;   E:\arma3server\@ExileServer\extDB\sql_custom\exile.ini
;
; Keep these four sections together. They are read-only server-push queries for
; xcsv_chatter's "while you were away" briefing; there is no client request path
; that can trigger them.

[xcsvBriefingAccount]
SQL1_1 = SELECT CASE WHEN last_disconnect_at IS NULL THEN -1 ELSE FLOOR((UNIX_TIMESTAMP(NOW()) - UNIX_TIMESTAMP(last_disconnect_at)) / 60) END, total_connections FROM account WHERE uid = ?
SQL1_INPUTS = 1
OUTPUT = 1,2

[xcsvBriefingTerritory]
SQL1_1 = SELECT name, level, FLOOR((UNIX_TIMESTAMP(NOW()) - UNIX_TIMESTAMP(last_paid_at)) / 3600), flag_stolen, position_x, position_y FROM territory WHERE owner_uid = ? AND deleted_at IS NULL
SQL1_INPUTS = 1
OUTPUT = 1-STRING,2,3,4,5,6

[xcsvBriefingLostVehicles]
SQL1_1 = SELECT COUNT(*) FROM vehicle v JOIN account a ON a.uid = v.account_uid WHERE v.account_uid = ? AND v.deleted_at IS NOT NULL AND a.last_disconnect_at IS NOT NULL AND v.deleted_at > a.last_disconnect_at
SQL1_INPUTS = 1
OUTPUT = 1

[xcsvBriefingDeathsNear]
SQL1_1 = SELECT name, position_x, position_y FROM player_history WHERE died_at > (SELECT COALESCE(last_disconnect_at, NOW()) FROM account WHERE uid = ?) ORDER BY died_at DESC LIMIT 50
SQL1_INPUTS = 1
OUTPUT = 1-STRING,2,3
